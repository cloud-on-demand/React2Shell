---
- name: Blue Team | Connect to the challenge host
  hosts: blue_team
  gather_facts: false
  tasks:
    - name: Test the SSH login
      vars:
        walkthrough_caption: Confirm SSH access to the challenge host and show the remote user and hostname.
      ansible.builtin.shell:
        cmd: printf 'Connected as %s on %s\n' "$(id -un)" "$(hostname)"
        executable: /bin/bash
      changed_when: false
